<div class="flex h-screen overflow-hidden bg-background">

    <!-- ── Desktop sidebar -->
    <aside class="hidden w-60 shrink-0 flex-col border-r border-border bg-background md:flex"
        aria-label="Main navigation">
        <nav class="flex flex-col gap-1 px-3 mt-4" aria-label="Site sections">
            @for (link of navLinks; track link.path) {
            <a [routerLink]="link.path" routerLinkActive="bg-muted text-foreground font-medium"
                [routerLinkActiveOptions]="{ exact: link.path === '/' }"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
                [attr.aria-label]="link.label">
                <svg aria-hidden="true" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path [attr.d]="link.icon" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                {{ link.label }}
            </a>
            }
        </nav>

        <div class="mt-auto border-t border-border p-3">
            @if (authStore.user(); as user) {
            <div class="flex items-center gap-3 rounded-lg px-3 py-2">
                <img [src]="user.picture_medium" [alt]="user.name"
                    class="h-8 w-8 rounded-full object-cover ring-1 ring-border" />
                <span class="truncate text-sm font-medium">{{ user.name }}</span>
            </div>
            }
            <button (click)="authStore.logout()"
                class="mt-1 w-full rounded-lg px-3 py-2 text-left text-sm text-muted-foreground transition hover:bg-muted hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                Sign out
            </button>
        </div>
    </aside>

    <!-- ── Main content + player -->
    <div class="flex flex-1 flex-col overflow-hidden">
        <main class="flex-1 overflow-y-auto pb-28 md:pb-0" id="main-content" tabindex="-1">
            <router-outlet />
        </main>
        <div class="fixed bottom-16 left-0 right-0 z-40 md:static md:bottom-auto md:z-auto">
            <app-audio-player />
        </div>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 flex border-t border-border bg-background md:hidden"
        aria-label="Mobile navigation">
        @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="text-foreground"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="flex flex-1 flex-col items-center gap-1 py-3 text-muted-foreground transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
            [attr.aria-label]="link.label">
            <svg aria-hidden="true" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path [attr.d]="link.icon" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="text-xs">{{ link.label }}</span>
        </a>
        }
    </nav>

</div>
