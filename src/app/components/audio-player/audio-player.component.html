<app-queue />

@if (store.currentTrack(); as track) {
<div class="flex flex-col border-t border-border bg-background px-4 py-2 md:flex-row md:items-center md:gap-6 md:px-6 md:py-3"
    role="region" aria-label="Audio player">

    <!-- Track info -->
    <div class="flex min-w-0 flex-1 items-center gap-3">
        @if (hasAlbumCover(track)) {
        <img [src]="getAlbumCover(track)" [alt]="'Cover for ' + track.title"
            class="h-10 w-10 shrink-0 rounded object-cover ring-1 ring-border" />
        }
        <div class="min-w-0">
            <p class="truncate text-sm font-medium">{{ track.title }}</p>
            <p class="text-muted-foreground truncate text-xs">{{ track.artist.name }}</p>
        </div>
    </div>

    <!-- Controls + progress -->
    <div class="flex flex-1 flex-col items-center gap-1">

        <div class="flex items-center gap-4">

            <!-- Previous -->
            <button (click)="store.previous()" [disabled]="!store.hasPrevious()" aria-label="Previous track"
                class="text-muted-foreground transition hover:text-foreground disabled:opacity-30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring rounded-full p-1">
                <svg aria-hidden="true" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
                </svg>
            </button>

            <!-- Play / Pause -->
            <button (click)="store.togglePlay()" [attr.aria-label]="store.playing() ? 'Pause' : 'Play'"
                class="flex h-9 w-9 items-center justify-center rounded-full bg-foreground text-background transition hover:opacity-80 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
                @if (store.playing()) {
                <svg aria-hidden="true" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
                } @else {
                <svg aria-hidden="true" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                }
            </button>

            <!-- Skip -->
            <button (click)="store.skip()" [disabled]="!store.hasNext()" aria-label="Next track"
                class="text-muted-foreground transition hover:text-foreground disabled:opacity-30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring rounded-full p-1">
                <svg aria-hidden="true" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z" />
                </svg>
            </button>
            <div class="flex justify-end md:hidden">
                <button (click)="store.toggleQueue()"
                    [attr.aria-label]="store.queueOpen() ? 'Close queue' : 'Open queue'"
                    [attr.aria-expanded]="store.queueOpen()"
                    class="rounded-full p-1.5 text-muted-foreground transition hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
                    [class.text-foreground]="store.queueOpen()">
                    <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path
                            d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </div>


        <!-- Progress bar -->
        <div class="flex w-full max-w-lg items-center gap-2">
            <span class="text-muted-foreground w-8 text-right text-xs tabular-nums">
                {{ store.progressTime() }}
            </span>
            <input type="range" min="0" max="100" step="0.5" [value]="store.progress()" (input)="onSeek($event)"
                aria-label="Seek"
                class="h-1 w-full cursor-pointer appearance-none rounded-full bg-muted accent-foreground" />
            <span class="text-muted-foreground w-8 text-xs tabular-nums">
                {{ store.durationTime() }}
            </span>
        </div>
    </div>

    <!-- Volume + Queue toggle -->
    <div class="hidden flex-1 items-center justify-end gap-3 md:flex">

        <button (click)="store.toggleQueue()" [attr.aria-label]="store.queueOpen() ? 'Close queue' : 'Open queue'"
            [attr.aria-expanded]="store.queueOpen()"
            class="rounded-full p-1.5 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
            [class.text-foreground]="store.queueOpen()" [class.bg-muted]="store.queueOpen()"
            [class.text-muted-foreground]="!store.queueOpen()">
            <svg aria-hidden="true" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path
                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>

        <!-- Volume -->
        <button (click)="toggleMute()" [attr.aria-label]="store.volume() === 0 ? 'Unmute' : 'Mute'"
            class="text-muted-foreground hover:text-foreground transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring rounded-full p-1">
            @if (store.volume() === 0) {
            <svg aria-hidden="true" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                <path
                    d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z" />
            </svg>
            } @else {
            <svg aria-hidden="true" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
            </svg>
            }
        </button>
        <input type="range" min="0" max="1" step="0.01" [value]="store.volume()" (input)="onVolume($event)"
            aria-label="Volume"
            class="w-24 cursor-pointer appearance-none rounded-full bg-muted accent-foreground h-1" />
    </div>
</div>
}
